name: No committed permission grants

# This plugin can ship its own permission surface (a bundled skill or agent
# could carry a committed `.claude/settings*.json`), so it carries the same
# deterministic guard the projects that consume it do: a committed
# auto-approve is a standing grant for every future session, and belongs in
# untracked local config, never in the repo.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  no-committed-permission-grants:
    name: No committed permission grants
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout (full history to diff against base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure jq is available
        # The guard fails closed without jq, which is correct but would read as
        # a mystery failure. ubuntu-latest ships it; this keeps the job honest
        # on any runner that does not.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Fail on widened permissions in any tracked settings file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_committed_permission_grants.sh "$BASE_SHA"
