name: No committed permission grants

# This plugin can ship its own permission surface (a bundled skill or agent
# could carry a committed `.claude/settings*.json`), so it carries the same
# deterministic guard the projects that consume it do: a committed
# auto-approve is a standing grant for every future session, and belongs in
# untracked local config, never in the repo.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  no-committed-permission-grants:
    name: No committed permission grants
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      # A shallow checkout is enough: the guard inspects the PR's own tree and
      # compares against nothing, so it needs no history and no base ref.
      - uses: actions/checkout@v7

      - name: Fail on any permission grant in a tracked settings file
        run: python3 scripts/check_committed_permission_grants.py
